<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AI Quiz Game</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: linear-gradient(135deg, #1e3c72, #2a5298);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0;
    padding: 20px;
  }
  .card {
    background: white;
    border-radius: 16px;
    padding: 30px;
    max-width: 480px;
    width: 100%;
    box-shadow: 0 20px 50px rgba(0,0,0,0.3);
  }
  h1 {
    text-align: center;
    color: #1e3c72;
    margin-top: 0;
    font-size: 24px;
  }
  label {
    display: block;
    font-size: 14px;
    color: #555;
    margin-bottom: 6px;
    margin-top: 12px;
    font-weight: bold;
  }
  input[type="text"], select {
    width: 100%;
    padding: 12px;
    font-size: 16px;
    border: 2px solid #ddd;
    border-radius: 8px;
  }
  .difficulty-options {
    display: flex;
    gap: 8px;
    margin-top: 6px;
  }
  .diff-btn {
    flex: 1;
    padding: 10px 6px;
    font-size: 14px;
    border: 2px solid #ddd;
    border-radius: 8px;
    background: #f7f7f7;
    color: #333;
    cursor: pointer;
    font-weight: normal;
    margin-top: 0;
  }
  .diff-btn.selected {
    border-color: #2a5298;
    background: #e5edfa;
    color: #1e3c72;
    font-weight: bold;
  }
  button.primary {
    width: 100%;
    padding: 12px;
    font-size: 16px;
    font-weight: bold;
    border: none;
    border-radius: 8px;
    background: #2a5298;
    color: white;
    cursor: pointer;
    margin-top: 20px;
  }
  button.primary:hover { background: #1e3c72; }
  button.primary:disabled { background: #aaa; cursor: not-allowed; }
  .option {
    display: block;
    width: 100%;
    text-align: left;
    padding: 12px;
    margin: 8px 0;
    border: 2px solid #ddd;
    border-radius: 8px;
    background: #f7f7f7;
    color: #333;
    cursor: pointer;
    font-size: 15px;
  }
  .option:hover { border-color: #2a5298; }
  .option.correct { background: #c8f7c5; border-color: #2ecc71; }
  .option.wrong { background: #f7c5c5; border-color: #e74c3c; }
  .hidden { display: none; }
  .top-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
  }
  .score {
    font-size: 16px;
    color: #1e3c72;
    font-weight: bold;
  }
  .timer {
    font-size: 16px;
    font-weight: bold;
    color: #e74c3c;
    padding: 4px 10px;
    border: 2px solid #e74c3c;
    border-radius: 20px;
  }
  .timer.warning {
    background: #e74c3c;
    color: white;
  }
  .progress {
    text-align: center;
    color: #777;
    margin-bottom: 15px;
    font-size: 14px;
  }
  .loader {
    text-align: center;
    color: #2a5298;
    padding: 20px;
  }
  .question-text {
    font-size: 18px;
    margin-bottom: 16px;
    color: #222;
  }
</style>
</head>
<body>

<div class="card">
  <h1>🧠 AI Quiz Game</h1>

  <!-- Setup screen -->
  <div id="setup">
    <label>Topic</label>
    <input type="text" id="topicInput" placeholder="e.g. History, Math, Science">

    <label>Number of questions</label>
    <input type="text" id="countInput" value="5">

    <label>Difficulty</label>
    <div class="difficulty-options" id="difficultyOptions">
      <button type="button" class="diff-btn" data-level="Easy">Easy</button>
      <button type="button" class="diff-btn selected" data-level="Medium">Medium</button>
      <button type="button" class="diff-btn" data-level="Hard">Hard</button>
    </div>

    <label>Seconds per question</label>
    <input type="text" id="timeInput" value="20">

    <button class="primary" id="startBtn">Start Quiz</button>
  </div>

  <!-- Loading -->
  <div id="loading" class="loader hidden">Generating questions...</div>

  <!-- Quiz screen -->
  <div id="quiz" class="hidden">
    <div class="top-row">
      <div class="score">Score: <span id="scoreVal">0</span></div>
      <div class="timer" id="timerVal">20</div>
    </div>
    <div class="progress">Question <span id="qNum">1</span> / <span id="qTotal">5</span></div>
    <div class="question-text" id="questionText"></div>
    <div id="options"></div>
    <button class="primary hidden" id="nextBtn">Next Question</button>
  </div>

  <!-- Result screen -->
  <div id="result" class="hidden">
    <h2 style="text-align:center;color:#1e3c72;">Result</h2>
    <p style="text-align:center;font-size:20px;" id="finalScore"></p>
    <button class="primary" id="restartBtn">Play Again</button>
  </div>

</div>

<script>
let questions = [];
let currentIndex = 0;
let score = 0;
let selectedDifficulty = 'Medium';
let secondsPerQuestion = 20;
let timeLeft = 0;
let timerInterval = null;

const setupDiv = document.getElementById('setup');
const loadingDiv = document.getElementById('loading');
const quizDiv = document.getElementById('quiz');
const resultDiv = document.getElementById('result');
const timerValEl = document.getElementById('timerVal');

document.querySelectorAll('.diff-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.diff-btn').forEach(b => b.classList.remove('selected'));
    btn.classList.add('selected');
    selectedDifficulty = btn.dataset.level;
  });
});

document.getElementById('startBtn').addEventListener('click', startQuiz);
document.getElementById('nextBtn').addEventListener('click', () => {
  clearInterval(timerInterval);
  nextQuestion();
});
document.getElementById('restartBtn').addEventListener('click', () => {
  resultDiv.classList.add('hidden');
  setupDiv.classList.remove('hidden');
});

async function startQuiz() {
  const topic = document.getElementById('topicInput').value.trim();
  const count = parseInt(document.getElementById('countInput').value) || 5;
  secondsPerQuestion = parseInt(document.getElementById('timeInput').value) || 20;

  if (!topic) {
    alert("Please enter a topic!");
    return;
  }

  setupDiv.classList.add('hidden');
  loadingDiv.classList.remove('hidden');

  try {
    questions = await generateQuestions(topic, count, selectedDifficulty);
    currentIndex = 0;
    score = 0;
    document.getElementById('qTotal').textContent = questions.length;
    document.getElementById('scoreVal').textContent = score;

    loadingDiv.classList.add('hidden');
    quizDiv.classList.remove('hidden');
    showQuestion();
  } catch (err) {
    console.error(err);
    alert("There was an error generating questions. Please try again.");
    loadingDiv.classList.add('hidden');
    setupDiv.classList.remove('hidden');
  }
}

async function generateQuestions(topic, count, difficulty) {
  const prompt = `Create exactly ${count} multiple-choice quiz questions about "${topic}" in English, at a ${difficulty} difficulty level.
Respond ONLY with a valid JSON array, no other text, no markdown code fences. Each item must have this exact shape:
{"question": "...", "options": ["...", "...", "...", "..."], "correctIndex": 0}
correctIndex is the 0-based index of the correct option in the options array. Make questions factually correct and appropriately challenging for the ${difficulty} level.`;

  const response = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      model: "claude-sonnet-4-6",
      max_tokens: 1200,
      messages: [{ role: "user", content: prompt }]
    })
  });

  const data = await response.json();
  const text = data.content.map(c => c.text || "").join("\n");
  const clean = text.replace(/```json|```/g, "").trim();
  const parsed = JSON.parse(clean);
  return parsed;
}

function showQuestion() {
  const q = questions[currentIndex];
  document.getElementById('qNum').textContent = currentIndex + 1;
  document.getElementById('questionText').textContent = q.question;

  const optionsDiv = document.getElementById('options');
  optionsDiv.innerHTML = '';
  document.getElementById('nextBtn').classList.add('hidden');

  q.options.forEach((opt, idx) => {
    const btn = document.createElement('button');
    btn.className = 'option';
    btn.textContent = opt;
    btn.addEventListener('click', () => selectAnswer(idx));
    optionsDiv.appendChild(btn);
  });

  startTimer();
}

function startTimer() {
  clearInterval(timerInterval);
  timeLeft = secondsPerQuestion;
  timerValEl.textContent = timeLeft;
  timerValEl.classList.remove('warning');

  timerInterval = setInterval(() => {
    timeLeft--;
    timerValEl.textContent = timeLeft;
    if (timeLeft <= 5) {
      timerValEl.classList.add('warning');
    }
    if (timeLeft <= 0) {
      clearInterval(timerInterval);
      timeUp();
    }
  }, 1000);
}

function timeUp() {
  const q = questions[currentIndex];
  const buttons = document.querySelectorAll('.option');
  buttons.forEach(b => b.disabled = true);
  buttons[q.correctIndex].classList.add('correct');
  document.getElementById('nextBtn').classList.remove('hidden');
}

function selectAnswer(idx) {
  clearInterval(timerInterval);
  const q = questions[currentIndex];
  const buttons = document.querySelectorAll('.option');
  buttons.forEach(b => b.disabled = true);

  buttons[q.correctIndex].classList.add('correct');
  if (idx !== q.correctIndex) {
    buttons[idx].classList.add('wrong');
  } else {
    score++;
    document.getElementById('scoreVal').textContent = score;
  }

  document.getElementById('nextBtn').classList.remove('hidden');
}

function nextQuestion() {
  currentIndex++;
  if (currentIndex < questions.length) {
    showQuestion();
  } else {
    quizDiv.classList.add('hidden');
    resultDiv.classList.remove('hidden');
    document.getElementById('finalScore').textContent =
      `You got ${score} out of ${questions.length} questions right!`;
  }
}
</script>

</body>
</html>
